version: 2
project_name: gg
builds:
  - id: gg
    main: ./cmd/gg
    binary: gg
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
    # stable names so the installers can use releases/latest/download/<name>
    name_template: "gg_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    # binary redistribution must carry the licence and the notices of the
    # modules it is built from
    files: [LICENSE, THIRD_PARTY_NOTICES.md, README.md, docs/*]
checksum:
  name_template: checksums.txt
# The checksum file is signed keylessly with the release workflow's identity
# (Sigstore). The installers and `cosign verify-blob` check it against that
# identity, so a replaced release cannot pass as genuine.
signs:
  - cmd: cosign
    artifacts: checksum
    certificate: '${artifact}.pem'
    signature: '${artifact}.sig'
    output: true
    args:
      - sign-blob
      - '--output-certificate=${certificate}'
      - '--output-signature=${signature}'
      - '${artifact}'
      - '--yes'
changelog:
  disable: true
