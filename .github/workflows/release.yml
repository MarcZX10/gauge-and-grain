name: release
on:
  push:
    tags: ["v*"]
# No permissions for the workflow as a whole: each job asks for what it needs.
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Release tags must point at main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - run: go test ./...
  release:
    needs: test
    runs-on: ubuntu-latest
    # The maintainer must protect this environment in the repository settings:
    # a required reviewer, and deployment tags limited to v*. Nothing in this
    # repository enforces that. Without it a pushed tag alone can publish a
    # release. The checklist is in docs/CONTRIBUTING.md (Release checklist).
    environment: release
    permissions:
      contents: write     # create the release and upload its assets
      id-token: write     # keyless signing and build provenance
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Release tags must point at main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with: { cosign-release: 'v2.6.5' } # pinned: the action's default is older, and the sign-blob flags target cosign v2
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # goreleaser leaves the release as a draft, so a failed attestation above
      # stops here and nothing is public. Publish only after the attestation exists.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "dist/gg_*.tar.gz,dist/gg_*.zip,dist/checksums.txt"
      - name: Publish the draft release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
