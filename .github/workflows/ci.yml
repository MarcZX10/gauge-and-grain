name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: go.mod }
      - run: go vet ./...
      - run: go test ./...
      - if: runner.os == 'Linux'
        run: go test -race ./internal/...
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: go.mod }
      - run: test -z "$(gofmt -l .)"
  modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: go.mod }
      - run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - run: go run ./scripts/notices | diff -q - THIRD_PARTY_NOTICES.md
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: go.mod }
      # pinned exactly, so the scanner changes only through a reviewed edit (dependabot does not track it)
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: go.mod }
      - run: make cross
  installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck scripts/install.sh
      # Without cosign the installer must stop before any download and install nothing. The base is a
      # closed local port: if the cosign gate were skipped, the download would fail with a different message.
      - name: installer refuses to install without cosign
        run: |
          unset GG_ALLOW_UNVERIFIED
          if command -v cosign >/dev/null 2>&1; then echo "cosign is on PATH; this test needs it absent"; exit 1; fi
          dir=$(mktemp -d)
          if out=$(GG_INSTALL_DIR="$dir/bin" GG_RELEASE_BASE=https://127.0.0.1:9/none sh scripts/install.sh 2>&1); then
            echo "$out"; echo "installer succeeded without cosign"; exit 1
          fi
          echo "$out" | grep -q "cosign is not installed" || { echo "$out"; echo "unexpected failure"; exit 1; }
          test ! -e "$dir/bin"
  installer-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Host $_ }; exit 1 }
  release-config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: go.mod }
      # Builds every archive and checksum without publishing or signing,
      # so a broken .goreleaser.yaml fails here and not on a release tag.
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.19.0
          args: release --snapshot --clean --skip=sign,publish
